<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Raider - Game</title>

    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* LEFT PANEL - Document Style */
        .left-panel {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        /* DRAGGABLE SPLITTER */
        .splitter {
            width: 6px;
            background: #e0e0e0;
            cursor: col-resize;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .splitter:hover {
            background: #6366f1;
        }

        .splitter::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            pointer-events: none;
        }

        /* RIGHT PANEL - Code + Animation */
        .right-panel {
            background: #1e293b;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 300px;
        }

        .chat-header {
            background: #6366f1;
            padding: 20px;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 40px 60px;
            scroll-behavior: smooth;
            background: #ffffff;
            line-height: 1.8;
            font-size: 15px;
        }

        .message {
            margin-bottom: 0;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
        }

        .message-story {
            color: #1f2937;
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 24px;
            font-style: italic;
        }

        .message-ai {
            color: #1f2937;
            margin-bottom: 20px;
        }

        .message-ai strong {
            color: #6366f1;
            font-weight: 600;
        }

        .message-user {
            color: #1f2937;
            margin-bottom: 20px;
        }

        .message-user strong {
            color: #3b82f6;
            font-weight: 600;
        }

        .message-system {
            color: #92400e;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message-complete {
            color: #065f46;
            font-size: 18px;
            font-weight: 600;
            margin: 32px 0;
            text-align: center;
            padding: 20px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        .code-block {
            background: #1e293b;
            border: none;
            padding: 16px;
            margin: 16px 0 24px 0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Inline Word-style editor */
        .inline-editor-word {
            margin: 4px 0 24px 0;
            padding: 0;
        }

        .inline-editor-content {
            display: inline;
            min-height: 24px;
            background: transparent;
            color: #3b82f6;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            outline: none;
            position: relative;
            cursor: text;
        }

        .inline-editor-content:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            font-style: italic;
            pointer-events: none;
        }

        .inline-editor-content:focus {
            background: rgba(99, 102, 241, 0.05);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .inline-editor-content:focus:empty:before {
            color: #6366f1;
        }

        /* RIGHT PANEL LAYOUT - Split into top (code) and bottom (animation) */
        .right-panel-header {
            background: #334155;
            padding: 20px;
            border-bottom: 1px solid #475569;
            text-align: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
        }

        .right-panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CODE SECTION - Top half, resizable */
        .code-section {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 100px;
        }

        .code-section-header {
            background: #0f172a;
            padding: 12px 20px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .code-display {
            flex: 1;
            background: #0f172a;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* Override Prism.js styling to match our dark theme */
        .code-display pre {
            margin: 0;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .code-display code {
            background: transparent !important;
            color: #e2e8f0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        /* Prism syntax highlighting colors (dark theme) */
        .code-display .token.comment { color: #6b7280; }
        .code-display .token.keyword { color: #c678dd; }
        .code-display .token.string { color: #98c379; }
        .code-display .token.number { color: #d19a66; }
        .code-display .token.function { color: #61afef; }
        .code-display .token.operator { color: #56b6c2; }
        .code-display .token.builtin { color: #e5c07b; }

        /* VERTICAL SPLITTER (between code and animation) */
        .vertical-splitter {
            height: 6px;
            background: #475569;
            cursor: row-resize;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .vertical-splitter:hover {
            background: #6366f1;
        }

        .vertical-splitter::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 3px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            pointer-events: none;
        }

        /* ANIMATION SECTION - Bottom half, resizable */
        .animation-section {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-height: 100px;
        }

        .animation-section-header {
            background: #0f172a;
            padding: 12px 20px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .animation-display {
            flex: 1;
            background: #0f172a;
            padding: 20px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.4;
            color: #94a3b8;
            white-space: pre;
            overflow-y: auto;
            overflow-x: auto;
            font-variant-ligatures: none;
            font-feature-settings: "liga" 0;
            tab-size: 2;
        }

        .animation-display pre {
            margin: 0;
            padding: 0;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            white-space: pre;
            letter-spacing: -0.5px;
            word-spacing: 0;
        }

        .audio-indicator {
            display: inline-block;
            margin-left: 10px;
            color: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .round-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 13px;
        }

        /* Scrollbar styling - Word-like */
        .chat-messages::-webkit-scrollbar,
        .code-display::-webkit-scrollbar,
        .animation-display::-webkit-scrollbar {
            width: 12px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #ffffff;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 6px;
            border: 3px solid #ffffff;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Right panel scrollbars */
        .code-display::-webkit-scrollbar-track,
        .animation-display::-webkit-scrollbar-track {
            background: #0f172a;
        }

        .code-display::-webkit-scrollbar-thumb,
        .animation-display::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 6px;
            border: 3px solid #0f172a;
        }

        .code-display::-webkit-scrollbar-thumb:hover,
        .animation-display::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- LEFT PANEL: Scrolling Chat -->
        <div class="left-panel" id="leftPanel">
            <div class="chat-header">
                <div>
                    <strong>🎮 CODE RAIDER</strong>
                </div>
                <div>
                    <span id="audioIndicator" style="display: none;" class="audio-indicator">🔊 CIPHER is speaking...</span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message message-system">
                    🔄 Connecting to CIPHER...
                </div>
            </div>
        </div>

        <!-- DRAGGABLE SPLITTER -->
        <div class="splitter" id="splitter"></div>

        <!-- RIGHT PANEL: Code (Top) + Animation (Bottom) -->
        <div class="right-panel" id="rightPanel">
            <div class="right-panel-header">
                💻 CODE & ANIMATION
            </div>

            <div class="right-panel-content" id="rightPanelContent">
                <!-- CODE SECTION - Top Half, Resizable -->
                <div class="code-section" id="codeSection">
                    <div class="code-section-header">AI Generated Code</div>
                    <div class="code-display" id="codeDisplay">// Code will appear here after CIPHER generates it...</div>
                </div>

                <!-- VERTICAL SPLITTER -->
                <div class="vertical-splitter" id="verticalSplitter"></div>

                <!-- ANIMATION SECTION - Bottom Half, Resizable -->
                <div class="animation-section" id="animationSection">
                    <div class="animation-section-header">Execution Animation</div>
                    <div class="animation-display" id="animationContent">// Animation will appear here after code execution...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio player (hidden) -->
    <audio id="audioPlayer" style="display: none;"></audio>

    <script>
        // HORIZONTAL SPLITTER (Left/Right Panels)
        const splitter = document.getElementById('splitter');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        const container = document.querySelector('.game-container');

        let isHorizontalDragging = false;

        splitter.addEventListener('mousedown', (e) => {
            isHorizontalDragging = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (isHorizontalDragging) {
                const containerRect = container.getBoundingClientRect();
                const newLeftWidth = e.clientX - containerRect.left;
                const containerWidth = containerRect.width;

                // Constrain to 20%-80%
                const minWidth = containerWidth * 0.2;
                const maxWidth = containerWidth * 0.8;

                if (newLeftWidth >= minWidth && newLeftWidth <= maxWidth) {
                    const leftPercent = (newLeftWidth / containerWidth) * 100;
                    const rightPercent = 100 - leftPercent;

                    leftPanel.style.width = `${leftPercent}%`;
                    rightPanel.style.width = `${rightPercent}%`;
                }
            } else if (isVerticalDragging) {
                // Vertical splitter logic (code/animation)
                const rightContentRect = rightPanelContent.getBoundingClientRect();
                const newTopHeight = e.clientY - rightContentRect.top;
                const contentHeight = rightContentRect.height;

                // Constrain to 20%-80%
                const minHeight = contentHeight * 0.2;
                const maxHeight = contentHeight * 0.8;

                if (newTopHeight >= minHeight && newTopHeight <= maxHeight) {
                    const topPercent = (newTopHeight / contentHeight) * 100;
                    const bottomPercent = 100 - topPercent;

                    codeSection.style.flex = `0 0 ${topPercent}%`;
                    animationSection.style.flex = `0 0 ${bottomPercent}%`;
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isHorizontalDragging) {
                isHorizontalDragging = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
            if (isVerticalDragging) {
                isVerticalDragging = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        // Set initial 50-50 split for left/right
        leftPanel.style.width = '50%';
        rightPanel.style.width = '50%';

        // VERTICAL SPLITTER (Code/Animation)
        const verticalSplitter = document.getElementById('verticalSplitter');
        const codeSection = document.getElementById('codeSection');
        const animationSection = document.getElementById('animationSection');
        const rightPanelContent = document.getElementById('rightPanelContent');

        let isVerticalDragging = false;

        verticalSplitter.addEventListener('mousedown', (e) => {
            isVerticalDragging = true;
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        // Set initial 25-75 split for code/animation (more space for animation)
        codeSection.style.flex = '0 0 25%';
        animationSection.style.flex = '0 0 75%';
    </script>

    <!-- Prism.js for syntax highlighting (supports Python, Java, JavaScript, C++, etc.) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script>
        // Verify Prism loaded
        window.addEventListener('load', () => {
            if (typeof Prism !== 'undefined') {
                console.log('✅ Prism.js loaded successfully');
                console.log('Available languages:', Object.keys(Prism.languages));
            } else {
                console.error('❌ Prism.js failed to load');
            }
        });
    </script>

    <script src="/static/js/game.js"></script>
</body>
</html>
