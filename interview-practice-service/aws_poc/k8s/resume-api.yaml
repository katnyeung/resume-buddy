---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-api
  namespace: app-services
  labels:
    app: resume-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-api
  template:
    metadata:
      labels:
        app: resume-api
    spec:
      containers:
      - name: resume-api
        image: katnyeung/resume-api:latest
        ports:
        - containerPort: 8080
        env:
        # Database
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_URL_RESUME
        - name: DB_USERNAME
          value: "neondb_owner"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATASOURCE_PASSWORD

        # CORS
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CORS_ALLOWED_ORIGINS

        # Frontend and Server URLs
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FRONTEND_URL
        - name: SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SERVER_URL

        # OpenAI / X.AI / NVIDIA Nemotron
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: OPENAI_API_KEY
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: XAI_API_KEY
        - name: OPENAI_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: OPENAI_BASE_URL
        - name: OPENAI_MODEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: OPENAI_MODEL

        # O*NET
        - name: ONET_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ONET_USERNAME
        - name: ONET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ONET_PASSWORD

        # Job Crawling
        - name: ADZUNA_APP_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADZUNA_APP_ID
        - name: ADZUNA_APP_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADZUNA_APP_KEY
        - name: REED_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REED_API_KEY
        - name: JSEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JSEARCH_API_KEY

        # Stripe
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: STRIPE_PRICE_ID_200
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_PRICE_ID_200
        - name: STRIPE_PRICE_ID_500
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_PRICE_ID_500
        - name: STRIPE_PRICE_ID_1000
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: STRIPE_PRICE_ID_1000

        # AWS SES
        - name: AWS_SES_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AWS_SES_USERNAME
        - name: AWS_SES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AWS_SES_PASSWORD

        # Docling/RunPod
        - name: DOCLING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DOCLING_SERVICE_URL
        - name: DOCLING_USE_RUNPOD
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DOCLING_USE_RUNPOD
        - name: RUNPOD_ENDPOINT_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RUNPOD_ENDPOINT_ID
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RUNPOD_API_KEY

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: resume-api-service
  namespace: app-services
spec:
  selector:
    app: resume-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
