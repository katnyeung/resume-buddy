spring:
  application:
    name: job-search-service

  datasource:
    url: jdbc:mysql://localhost:3306/jobsearch?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8085

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: com.resumebuddy.jobsearch.controller

# Custom Application Properties
app:
  # Resume API connection
  resume-api:
    base-url: ${RESUME_API_URL:http://localhost:8080/api}

  # OpenAI Embedding API
  openai:
    api-key: ${OPENAI_API_KEY}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

  # Grok LLM API (for job post generation)
  grok:
    api-key: ${GROK_API_KEY}
    model: ${GROK_MODEL:grok-4-fast-reasoning}
    base-url: ${GROK_BASE_URL:https://api.x.ai/v1}

logging:
  level:
    com.resumebuddy.jobsearch: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
