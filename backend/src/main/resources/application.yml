spring:
  application:
    name: resume-buddy-api

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0                  # Allow pool to drain to zero for Neon scale-to-zero
      connection-timeout: 20000        # 20 seconds
      idle-timeout: 60000              # 60 seconds - faster release
      max-lifetime: 300000             # 5 minutes - faster rotation
      keepalive-time: 30000            # 30 seconds - validate without keeping alive
      leak-detection-threshold: 60000  # 60 seconds

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "${OAUTH2_REDIRECT_URI}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  jpa:
    hibernate:
      ddl-auto: update  # Automatically update schema when entities change
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false  # Reduced logging - set to true for debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Enhanced schema management
        hbm2ddl:
          auto: update
        jdbc:
          batch_size: 20
          lob:
            non_contextual_creation: true  # Required for PostgreSQL JSONB
        order_inserts: true
        order_updates: true
        use_sql_comments: false  # Reduced logging

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Email Configuration (AWS SES SMTP)
  mail:
    host: ${MAIL_HOST:email-smtp.eu-west-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${AWS_SES_USERNAME}
    password: ${AWS_SES_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Neo4j Configuration
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
    database: ${NEO4J_DATABASE}

  # Spring Data Configuration
  data:
    # Redis (for job queue)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
    # Neo4j
    neo4j:
      database: ${NEO4J_DATABASE}

server:
  port: 8080
  forward-headers-strategy: framework  # Required for OAuth2 behind reverse proxy
  # Set the public base URL for OAuth2 redirects
  servlet:
    context-path: ""  # Ensure no context path

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Custom Application Properties
app:
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:grok-4-fast-reasoning}
    base-url: ${OPENAI_BASE_URL:https://api.x.ai/v1}


  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-size: ${MAX_FILE_SIZE:10485760}
    cleanup:
      enabled: ${FILE_CLEANUP_ENABLED:true}
      retention-days: ${FILE_CLEANUP_RETENTION_DAYS:7}

  docling:
    service-url: ${DOCLING_SERVICE_URL:http://localhost:8081}
    use-runpod: ${DOCLING_USE_RUNPOD:true}
    runpod:
      endpoint-id: ${RUNPOD_ENDPOINT_ID}
      api-key: ${RUNPOD_API_KEY}
      timeout-seconds: ${RUNPOD_TIMEOUT_SECONDS:300}
      poll-interval-ms: ${RUNPOD_POLL_INTERVAL_MS:2000}

  # Neo4j Configuration (for Neo4j Aura Cloud)
  neo4j:
    uri: ${NEO4J_URI}
    username: ${NEO4J_USERNAME}
    password: ${NEO4J_PASSWORD}
    database: ${NEO4J_DATABASE}  # Default database name

  # O*NET API Configuration
  onet:
    base-url: ${ONET_BASE_URL:https://services.onetcenter.org/ws}
    username: ${ONET_USERNAME}
    password: ${ONET_PASSWORD}
    # Number of days before O*NET occupation data (skills, technologies, tasks, activities) is considered stale
    # Set to 0 to always refresh (useful for testing)
    # Set to 30 for monthly refresh (recommended for production)
    # Set to 90 for quarterly refresh (if O*NET data doesn't change often)
    data-refresh-days: ${ONET_DATA_REFRESH_DAYS:30}

  # Security Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    # Internal API Key for service-to-service authentication
    # Used by interview-practice-service and other microservices
    internal-api-key: ${INTERNAL_API_KEY:}

  # Frontend URL for OAuth redirect
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  # Token Cost Configuration (credits per job type)
  token-costs:
    resume-upload: ${RESUME_UPLOAD_COST:50}
    resume-analysis: ${RESUME_ANALYSIS_COST:50}
    job-experience-analysis: ${JOB_EXPERIENCE_ANALYSIS_COST:50}
    job-profile-generation: ${JOB_PROFILE_GENERATION_COST:25}

  # Job Queue Configuration
  job-queue:
    enabled: ${JOB_QUEUE_ENABLED:true}
    storage: ${JOB_QUEUE_STORAGE:redis}  # "postgres" or "redis" - redis recommended for internal apps
    max-concurrent-workers: ${JOB_QUEUE_MAX_WORKERS:3}  # Max 3 jobs processing simultaneously
    poll-interval-ms: ${JOB_QUEUE_POLL_INTERVAL:10000}  # Poll every 10s with Redis (300000 for Postgres)
    user-rate-limit: ${JOB_QUEUE_USER_LIMIT:2}          # Max 2 jobs per user simultaneously

# Stripe Payment Configuration
stripe:
  api-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL:${FRONTEND_URL:}/credits/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:${FRONTEND_URL:}/credits}
  # Stripe Price IDs for credit packages (create these in Stripe Dashboard)
  price-id-200: ${STRIPE_PRICE_ID_200}
  price-id-500: ${STRIPE_PRICE_ID_500}
  price-id-1000: ${STRIPE_PRICE_ID_1000}

logging:
  level:
    # Application logs - keep INFO for important events
    com.resumebuddy: INFO
    com.resumebuddy.service.JobQueueWorker: INFO  # Job queue processing
    com.resumebuddy.service.JobAnalysisService: INFO  # Analysis progress
    com.resumebuddy.service.Neo4jGraphService: WARN  # Reduce Neo4j query logs

    # Spring framework - reduce noise
    org.springframework.web: WARN
    org.springframework.web.servlet.mvc: WARN

    # Hibernate/JPA - reduce SQL logs
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN

    # Keep root at INFO
    root: INFO
