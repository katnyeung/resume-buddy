---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-search
  namespace: app-services
  labels:
    app: job-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-search
  template:
    metadata:
      labels:
        app: job-search
    spec:
      containers:
      - name: job-search
        image: katnyeung/job-search:latest
        ports:
        - containerPort: 8085
        env:
        # Database
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_URL_JOBSEARCH
        - name: DB_USERNAME
          value: "neondb_owner"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD_JOBSEARCH

        # Redis
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT

        # CORS Configuration
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CORS_ALLOWED_ORIGINS

        # Resume API (internal service DNS)
        - name: RESUME_API_URL
          value: "http://resume-api-service:8080/api"

        # OpenAI / X.AI
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: OPENAI_EMBEDDING_MODEL
        - name: OPENAI_EMBEDDING_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: OPENAI_EMBEDDING_URL

        # Job Crawling
        - name: ADZUNA_APP_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADZUNA_APP_ID
        - name: ADZUNA_APP_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ADZUNA_APP_KEY
        - name: REED_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REED_API_KEY
        - name: JSEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JSEARCH_API_KEY

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /swagger-ui.html
            port: 8085
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /swagger-ui.html
            port: 8085
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: job-search-service
  namespace: app-services
spec:
  selector:
    app: job-search
  ports:
  - protocol: TCP
    port: 8085
    targetPort: 8085
  type: ClusterIP
